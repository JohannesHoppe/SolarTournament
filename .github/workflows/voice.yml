# Nicole in German, Spanish and French (see tools/voice/README.md): clones the lines the store
# in the release "voice-nicole" still lacks, one job per language, and puts the store back
# there. Runs when the lines, their translations or the clone tools change, and by hand
# (Actions → Voice → Run workflow). A job stops after about five hours and keeps what it has
# cloned; running the workflow again goes on from there.
name: Voice

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/music/lines.ts
      - src/i18n/de.ts
      - src/i18n/es.ts
      - src/i18n/fr.ts
      - tools/voice/nicole.ts
      - tools/voice/clone/**
      - .github/workflows/voice.yml

permissions:
  contents: write

# one run at a time: two would both write the same store
concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        language: [de, es, fr]
    steps:
      - run: echo "WORK=$RUNNER_TEMP/voice" >> "$GITHUB_ENV"
      # actions pinned to their commits; the token stays out of the checkout and out of every
      # install script, only the steps that read and write the release get it
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      # no install scripts: this job holds a token that writes to the repository, and nothing it
      # runs needs one (onnxruntime-node and sharp ship their Linux binaries in their packages;
      # onnxruntime-node's script would only fetch CUDA libraries, unchecked, and ffmpeg is not used)
      - run: npm ci --ignore-scripts
      # the store of this language and Nicole's voice (voice print and reference), as far as the
      # release has them; a download that fails stops the job, so a store that is there is never
      # taken for an empty one and overwritten. Nicole's voice is shared by all three jobs: only a
      # job that made it puts it into the release (see "Upload the store").
      - name: Download the store
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK"
          assets=$(gh release view voice-nicole --json assets --jq '.assets[].name')
          for file in "nicole-${{ matrix.language }}.json" nicole-conds.pt reference.wav; do
            if grep -qx "$file" <<< "$assets"; then gh release download voice-nicole --dir "$WORK" --pattern "$file"; fi
          done
          # the index names its audio by its fingerprint (see cloneAudioName in tools/voice/nicole.ts)
          if [ -f "$WORK/nicole-${{ matrix.language }}.json" ]; then
            audio="nicole-${{ matrix.language }}-$(node -p "require('$WORK/nicole-${{ matrix.language }}.json').audio.slice(0, 16)").flac"
            if ! grep -qx "$audio" <<< "$assets"; then echo "The release lacks $audio, the audio its index names"; exit 1; fi
            gh release download voice-nicole --pattern "$audio" --output "$WORK/nicole-${{ matrix.language }}.flac"
          fi
          if grep -qx nicole-conds.pt <<< "$assets"; then echo "voice=kept" >> "$GITHUB_OUTPUT"; else echo "voice=new" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare
        id: prepare
        run: |
          node tools/voice/clone/prepare.ts "$WORK"
          # without a voice print in the release, German makes it and the others wait for the
          # next run, so every language speaks with the same one
          if [ "${{ steps.store.outputs.voice }}" = new ] && [ "${{ matrix.language }}" != de ]; then echo "todo=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          # German makes the voice print even with nothing to clone
          if [ "${{ steps.store.outputs.voice }}" = new ]; then echo "todo=voice" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "todo=$(node -p "require('$WORK/todo.json')['${{ matrix.language }}']")" >> "$GITHUB_OUTPUT"
      - if: steps.prepare.outputs.todo != '0'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # torch from its CPU index: the runner has no GPU, and the CUDA build is gigabytes larger
      - if: steps.prepare.outputs.todo != '0'
        run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r "$WORK/requirements.txt"
      - if: steps.prepare.outputs.todo != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('tools/voice/nicole.ts') }}
      - if: steps.prepare.outputs.todo != '0'
        name: Clone
        run: python tools/voice/clone/clone.py "$WORK" ${{ matrix.language }} 290
      # also after a clone that broke off: the store written every ten lines is kept. The audio
      # goes up under its fingerprint before its index, which names it, so an index never points
      # at another audio; older audio of the language goes once the new index is up.
      - if: always() && steps.prepare.outputs.todo != '0'
        name: Upload the store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          language=${{ matrix.language }}
          if [ "${{ steps.store.outputs.voice }}" = new ] && [ "$language" = de ] && [ -f "$WORK/nicole-conds.pt" ]; then gh release upload voice-nicole "$WORK/nicole-conds.pt" "$WORK/reference.wav" --clobber; fi
          # a clone that broke off before its first ten lines wrote no store
          [ -f "$WORK/nicole-$language.json" ] || exit 0
          audio="nicole-$language-$(node -p "require('$WORK/nicole-$language.json').audio.slice(0, 16)").flac"
          cp "$WORK/nicole-$language.flac" "$WORK/$audio"
          gh release upload voice-nicole "$WORK/$audio" --clobber
          gh release upload voice-nicole "$WORK/nicole-$language.json" --clobber
          for old in $(gh release view voice-nicole --json assets --jq '.assets[].name' | grep -E "^nicole-$language(-[0-9a-f]{16})?\.flac$" | grep -vx "$audio"); do
            gh release delete-asset voice-nicole "$old" --yes
          done
