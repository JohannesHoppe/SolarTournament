# The Nostr relays of the online tournament (see tools/relays/README.md): checks the relays in
# src/net/relays.json, Trystero's built-in ones and those the NIP-66 relay monitors report, and
# commits a new list to main when the healthy ones changed. Every Monday, and by hand
# (Actions → Relays → Run workflow).
name: Relays

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: relays
  cancel-in-progress: false

jobs:
  # runs Trystero's code and reads what the relays answer, so it may only read: the list goes on
  # as the job's output, never through the working tree to a job that holds a token
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      # actions pinned to their commits
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # the check only needs Trystero, which runs no install scripts
      - run: npm ci --ignore-scripts
      - run: npm run relays
      - id: list
        run: echo "list=$(base64 -w0 src/net/relays.json)" >> "$GITHUB_OUTPUT"

  # runs nothing but the shell, git and gh, in a fresh checkout: commits a changed list, and starts
  # the workflow CI for it (a push with this token starts no workflow by itself)
  commit:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - name: Commit a changed list
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ needs.check.outputs.list }}
        run: |
          printf '%s' "$LIST" | base64 -d > src/net/relays.json
          jq -e '(.relays | type == "array") and all(.relays[]; type == "string" and startswith("wss://"))' src/net/relays.json > /dev/null
          if git diff --quiet -- src/net/relays.json; then echo "The list is unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/net/relays.json
          git commit -m "Relays: the weekly check's healthy Nostr relays for the online tournament"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
