# Builds the game and publishes it to Cloudflare Pages (project "solartournament").
# stage_prod is the production branch: https://solartournament.games
# main is the test stage: https://test.solartournament.games (branch alias main.solartournament.pages.dev)
name: Deploy

on:
  push:
    branches: [main, stage_prod]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relaunch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relaunch/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run pages:deploy -- "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
