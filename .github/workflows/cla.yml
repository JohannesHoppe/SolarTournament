# The CLA check of CONTRIBUTING.md: every author of a pull request (its opener and the author
# of each of its commits) needs a file contributors/<login>.txt, on the main branch already or
# added by the pull request itself. The check labels the pull request "cla: missing" or
# "cla: signed", comments once whenever that state changes (and once on the first run), and
# fails while a signature is missing. The maintainer and bots need no file.
#
# pull_request_target runs this file as it is on main, with the right to comment and label on
# pull requests from forks. It never checks out or runs code of the pull request: it only reads
# the pull request's files as text through the API.
name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MAINTAINER = 'johanneshoppe';
            const MARKER = (state) => `<!-- cla-check: ${state} -->`;
            const LABELS = {
              missing: { name: 'cla: missing', color: 'd73a4a', description: 'An author has not signed the CLA yet (see CONTRIBUTING.md)' },
              signed: { name: 'cla: signed', color: '0e8a16', description: 'Every author has signed the CLA' },
            };
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const number = pr.number;
            const agreement = `https://github.com/${owner}/${repo}/blob/${pr.base.ref}/CONTRIBUTING.md`;

            // who wrote what is in the pull request
            const authors = new Set([pr.user.login]);
            const unlinked = [];
            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
            for (const commit of commits) {
              if (commit.author?.login) authors.add(commit.author.login);
              else unlinked.push(commit.sha.slice(0, 7));
            }
            const needed = [...authors].filter((login) => login.toLowerCase() !== MAINTAINER && !login.endsWith('[bot]'));

            // a signature: the file names the agreement and is signed with the login
            const escape = (text) => text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            async function signature(login, where) {
              try {
                const { data } = await github.rest.repos.getContent({ ...where, path: `contributors/${login}.txt` });
                const text = Buffer.from(data.content, 'base64').toString('utf8');
                return /Contributor License Agreement/i.test(text) && new RegExp(`Signed:\\s*@?${escape(login)}\\s*$`, 'im').test(text);
              } catch {
                return false;
              }
            }
            const base = { owner, repo, ref: pr.base.ref };
            const head = pr.head.repo ? { owner: pr.head.repo.owner.login, repo: pr.head.repo.name, ref: pr.head.sha } : null;
            const missing = [];
            for (const login of needed) {
              if (!(await signature(login, base)) && !(head && (await signature(login, head)))) missing.push(login);
            }
            const state = missing.length || unlinked.length ? 'missing' : 'signed';

            // labels: exactly one of the two
            for (const label of Object.values(LABELS)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            const other = state === 'missing' ? 'signed' : 'missing';
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [LABELS[state].name] });
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: LABELS[other].name });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // one comment whenever the state changes, and one on the first run
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const last = comments.filter((comment) => comment.user?.type === 'Bot' && /<!-- cla-check: \w+ -->/.test(comment.body ?? '')).pop();
            if (!last?.body.includes(MARKER(state))) {
              const sentence = (login) => [
                '```',
                'I hereby accept the terms of the Contributor License Agreement in the CONTRIBUTING.md file of the JohannesHoppe/SolarTournament git repository as of October 21, 2026.',
                '',
                `Signed: ${login}`,
                '```',
              ].join('\n');
              const body = state === 'signed'
                ? [MARKER(state), `**CLA signed.** ${needed.length ? `Every author of this pull request (${needed.map((login) => `@${login}`).join(', ')}) has signed the [Contributor License Agreement](${agreement}).` : 'This pull request needs no signature.'} Thank you!`].join('\n\n')
                : [
                    MARKER(state),
                    `**CLA missing.** Thank you for your pull request! Before it can be merged, every author has to sign the [Contributor License Agreement](${agreement}) once. You keep the copyright in your contribution; the agreement lets Johannes Hoppe license the code under other terms as well, next to the AGPL.`,
                    ...missing.map((login) => `@${login}: please add the file \`contributors/${login}.txt\` to this pull request, with this content:\n\n${sentence(login)}`),
                    ...(unlinked.length ? [`These commits are not linked to a GitHub account, so their authors are unknown: ${unlinked.join(', ')}. Please set your commit e-mail address to one of your account's addresses and push the commits again.`] : []),
                    'This check runs again with every push to the pull request.',
                  ].join('\n\n');
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            if (state === 'missing') core.setFailed(`CLA missing: ${[...missing, ...unlinked].join(', ')}`);
