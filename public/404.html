<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in deep space · SolarTournament</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/crest.svg" type="image/svg+xml">
  <style>
    /* a static page outside the build: everything it needs is here */
    :root {
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: radial-gradient(ellipse at top, #1a0d02 0%, #02030a 60%);
      color: #e8edf8;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    img {
      width: 120px;
      height: 120px;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: 1.6rem;
      color: #fff;
      text-shadow: 0 0 6px #ff9d00, 0 0 18px #ff6a00;
    }
    p {
      margin: 0 0 20px;
      color: #9aa6bd;
    }
    a {
      color: #04101f;
      background: #ff9d00;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 2px solid #4d91ff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/crest.svg" alt="SolarTournament">
    <h1>Lost in deep space</h1>
    <p>This page does not exist. Your clone drifted out of the arena.</p>
    <a href="/">Back to the hangar</a>
  </main>
</body>
</html>
